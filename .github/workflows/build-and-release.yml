# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build-tag
on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: setup java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Determine jar version from tag
        shell: bash
        # release.sh strips a leading "v" off the tag when writing mod_version (Fabric Loader
        # requires strict SemVer there), so the built jar's filename never has the "v" either -
        # match that here so the release step actually finds the file.
        run: echo "JAR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Create Github release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/wato-${{ env.JAR_VERSION }}.jar

      - name: Push to modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: f19Wo02n